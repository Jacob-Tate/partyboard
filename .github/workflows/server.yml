name: Relay server

on:
  push:
    paths:
      - 'server/**'
      - 'include/netplay/**'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'include/netplay/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/partyboard-server

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -f server/Dockerfile -t partyboard-server .

      - name: Start server container
        run: |
          docker run -d --name pbserver -p 7845:7845/udp partyboard-server
          sleep 2
          docker logs pbserver

      - name: Integration test against the container
        run: |
          docker run --rm --network host --entrypoint partyboard-server-test partyboard-server 127.0.0.1 7845

      - name: Server log
        if: always()
        run: docker logs pbserver

      - name: Image size
        run: docker image ls partyboard-server

      # Publish only tested images from the netplay branch (never from pull requests).
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/netplay'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/netplay'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          for tag in latest "$SHORT_SHA"; do
            docker tag partyboard-server "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Published $IMAGE:latest and $IMAGE:$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
